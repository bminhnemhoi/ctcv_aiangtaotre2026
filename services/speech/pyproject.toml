[project]
name = "ctcv-speech"
version = "0.1.0"
description = "Speech service: ASR (PhoWhisper via faster-whisper) and cached TTS — E01 skeleton, real models land in E04"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ctcv-core",
  "fastapi>=0.115",
  "python-multipart>=0.0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# E04 (epics/E04.md) — heavy model runtimes are deliberately NOT installed in E01.
# When E04 lands, uncomment, add each package to config/allowed-deps.yaml (D26) and install
# with `uv sync --package ctcv-speech --extra runtime` on the machine that serves models.
# faster-whisper (MIT) pulls ctranslate2 + tokenizers; torch is only needed if ADR-002 picks a
# torch-based TTS (F5-TTS-Vietnamese / viXTTS) — Piper vi_VN needs onnxruntime only.
runtime = [
  # "faster-whisper>=1.1",   # E04 — PhoWhisper INT8 (models.asr / models.asr_small)
  # "torch>=2.4",            # E04 — only for a torch-based TTS chosen in ADR-002
  # "piper-tts>=1.2",        # E04 — Piper vi_VN candidate (MIT, low RTF on CPU)
]

[project.scripts]
ctcv-speech = "ctcv_speech.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctcv_speech"]

[tool.uv.sources]
ctcv-core = { workspace = true }
