# ctcv-data: data pipeline (`python -m ctcv_data.pipeline <step>`) and the dataset/model
# registry (`data/registry/*.yaml`). Owned by WP H (brief §16).
[project]
name = "ctcv-data"
version = "0.1.0"
description = "CTCV data pipeline (crawl → normalize → synth → eval sets) and dataset/model registry"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ctcv-core",
  "ctcv-agent",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctcv_data"]

[tool.uv.sources]
ctcv-core = { workspace = true }
ctcv-agent = { workspace = true }
