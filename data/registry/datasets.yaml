  collected_at: "2026-09-25"
  size: { records: 130, mb: 0.06 }
  sha256: 2f23e88d88912f2010baa5b099b02c9ed5081420c57622b387b6fa9538745d1f
  path: eval/sets/samples/qa_tthc.jsonl
  used_for: [eval]
  pii: none
  eval_only: false
  notes: >-
    Tập hỏi đáp thủ tục cho suite qa (ADR-007 C8, lược đồ eval/sets/samples/qa_tthc.schema.json).
    qa_tthc.jsonl: 130 câu sinh tất định bằng `uv run python -m ctcv_data.pipeline build_eval_sets`
    từ 107 bản ghi thật của tthc-bca-v1 (4 mẫu câu mỗi loại phí/thời hạn/giấy tờ, 10 % bỏ dấu;
    expected_values chép từ trường có cấu trúc của bản ghi, ghi nguồn "Cổng Dịch vụ công - Bộ Công
    an"); bỏ câu phí của bản ghi bị gắn cờ phi_khong_ro/phi_bat_thuong và câu thời hạn dài nhiều
    trường hợp. Kèm tệp soạn tay qa_tthc_handwritten.jsonl (83 câu, source handwritten:qa-tester,
    khẩu ngữ/phương ngữ/không dấu/ngoài kho/nhạy cảm/làm thay/chèn lệnh) — do đội soạn, không phải
    câu hỏi thật của người dân. Chia dev/test theo sha256(gold_procedure_id) cho câu sinh, theo số
    id cho câu soạn tay; chỉ báo cáo trên test. Không chứa dữ liệu cá nhân (test_no_pii quét).
    sha256 là của qa_tthc.jsonl (điền bằng `registry --update-hashes` ở P14, 25/9/2026); sha256
    của qa_tthc_handwritten.jsonl lúc đo:
    bfabd88904cb169331970975a8db4da8b8365fb15264315078450b9bc8a1d920. Hai tệp không đổi giữa
    lượt đo v1 (03:07Z) và v2 (07:34Z) ngày 25/9/2026 — kiểm lại bằng `registry --update-hashes`.
    Kết quả đo: eval/reports/latest.json, ablation-tthc.json, latency-cpu-only.json.

