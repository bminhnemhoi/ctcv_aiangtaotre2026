# Bản MẪU thông tin đội thi (brief D25). Chép file này thành `team.yaml` trong cùng thư mục
# rồi điền dữ liệu thật. `team.yaml` nằm trong .gitignore và KHÔNG BAO GIỜ được commit,
# đưa lên Google Drive hay gửi cho công cụ AI. Mọi giá trị còn dấu <...> bị coi là chưa điền:
# `build_dossier.py` chỉ chấp nhận chúng ở chế độ --draft (kèm dấu "DỮ LIỆU MẪU").
# Sáu trường của mỗi thí sinh khớp đúng sáu dòng trong bảng thông tin của MẪU 3 (Bảng C).

