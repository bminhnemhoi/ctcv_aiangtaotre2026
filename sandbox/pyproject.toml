[project]
name = "ctcv-sandbox"
version = "0.1.0"
description = "Sandbox scenario schema, validator and state-machine engine (E01 brief §5)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ctcv-core",
  "pydantic>=2.7",
]

[project.scripts]
ctcv-sandbox-validate = "ctcv_sandbox.validate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctcv_sandbox"]

[tool.uv.sources]
ctcv-core = { workspace = true }
