[project]
name = "ctcv-api"
version = "0.1.0"
description = "CTCV API service: auth, classes, sandbox sessions, coach, drills, reports (FastAPI + SQLAlchemy 2 + Alembic)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ctcv-core",
  "ctcv-sandbox",
  "ctcv-agent",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "PyJWT>=2.9",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1",
  "prometheus-client>=0.20",
  "httpx>=0.28",
]

[project.scripts]
ctcv-api = "ctcv_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctcv_api"]

[tool.uv.sources]
ctcv-core = { workspace = true }
ctcv-agent = { workspace = true }
ctcv-sandbox = { workspace = true }
