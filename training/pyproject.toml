# ctcv-training: training configs (SFT/DPO/quantize/YOLOX/ASR-LoRA), the GPU/API budget gate
# and the run-directory convention (training/runs/<date>-<name>/). Owned by WP H (brief §16).
# E01 ships configs + budget + runs; the trainers themselves land in E07 (planner) and E08 (YOLOX).
[project]
name = "ctcv-training"
version = "0.1.0"
description = "CTCV fine-tuning runbook: training configs, budget gate, run directories and model cards"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ctcv-core",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctcv_training"]

[tool.uv.sources]
ctcv-core = { workspace = true }
