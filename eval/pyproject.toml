# ctcv-eval: evaluation harness (`python -m ctcv_eval.harness`), red-team runner
# (`python -m ctcv_eval.redteam`), load-test script and pilot report stub. Owned by WP H (brief §16).
# The red-team runner drives ctcv_agent (guardrails + router + quarantine) with a model-free planner,
# so `make redteam` belongs to `make check` (brief D13).
[project]
name = "ctcv-eval"
version = "0.1.0"
description = "CTCV evaluation: 6-suite harness with accept/block thresholds, model-free red-team runner, k6 load test, pilot report"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ctcv-core",
  "ctcv-agent",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctcv_eval"]

[tool.uv.sources]
ctcv-core = { workspace = true }
ctcv-agent = { workspace = true }
