[project]
name = "ctcv-agent"
version = "0.1.0"
description = "CTCV coach agent: planner client, quarantined reader, closed tool router, guardrails, citation check"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ctcv-core",
  "pydantic>=2.7",
  "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctcv_agent"]

[tool.uv.sources]
ctcv-core = { workspace = true }
