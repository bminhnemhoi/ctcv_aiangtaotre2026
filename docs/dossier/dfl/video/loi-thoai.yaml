# Lời thoại và phụ đề video Data for Life 2026 (đề DA940-01), hợp đồng C9 của ADR-007.
# Người đọc: docs/dossier/dfl/video/make_video.py (ghép video), slide HTML trong video/slides/,
# kịch bản chi tiết cho người quay: docs/dossier/dfl/kich-ban-video.md.
#
# Luật:
# - Chỉ quay tính năng chạy thật (Thể lệ, Điều 7): mọi đoạn demo đều có assert Playwright trên stack
#   thật (API + Ollama cục bộ, không mock). Không giọng nói nhân tạo, không nhạc.
# - kind: slide → có slide (tên file HTML) và seconds; demo_step = null.
#   kind: demo  → có demo_step (id bước trong record-demo.demo.ts); slide = null; KHÔNG có seconds,
#   thời lượng lấy đúng mốc thật trong timeline.json. est_seconds chỉ là ngân sách ước tính để lập
#   kế hoạch (tổng slide + ước tính demo = target_seconds ≤ 180); công cụ ghép có thể bỏ qua khóa này.
# - subtitle: tiếng Việt, tối đa 2 dòng, mỗi dòng ≤ 42 ký tự (xuống dòng bằng \n).
# - Phụ đề không chứa con số đo; số đo chỉ hiện trên slide 04/05, đọc từ eval/reports/*.json.
# - Trích đề DA940-01 đúng nguyên văn, dùng … khi lược bớt. Không trích câu "hàng chục triệu
#   người dân cần được hướng": trên trang gốc câu này bị cắt dở.
# - Không dùng ảnh trong docs/screens/ (chụp với API giả lập, có chữ "dữ liệu thử").
