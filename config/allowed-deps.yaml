# Single dependency allow-list (brief D26). `make audit` (scripts/check_deps.py) fails when a
# package in uv.lock / pnpm-lock.yaml is missing here, when a runtime entry carries a banned
# license, or when a banned package appears at all. Adding a library = add a row with its real
# license, the reason and the epic (CLAUDE.md "thêm thư viện ngoài danh sách → hỏi trước, ghi ADR").
# `runtime: true` = shipped inside a service image; false = dev/test/build tooling only.
# Seeded 2026-09-18 from the E01 lockfile (licenses read from package metadata).
version: 1

banned_packages:
  - ultralytics # AGPL-3.0 — incompatible with the repo's Apache-2.0 (D7)
  - yolov5 # AGPL-3.0

banned_license_patterns:
  - 'AGPL'
  - '\bGPL' # matches GPL-*, not LGPL-*
  - 'CC-BY-NC'
  - 'NonCommercial'
  - 'SSPL'
  - 'BUSL'

