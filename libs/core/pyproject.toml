[project]
name = "ctcv-core"
version = "0.1.0"
description = "Shared library for CTCV services: validated config, coded errors, PII-safe JSON logging, paths, Vietnamese text utils"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctcv_core"]
