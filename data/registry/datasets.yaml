# data/registry/datasets.yaml — bản kê nguồn gốc, giấy phép và mã băm của mọi bộ dữ liệu
# (brief §9, §17.4; plan §7 bước 9). Schema: config/schemas/datasets-registry.schema.json.
# Kiểm tra + báo cáo: `python -m ctcv_data.pipeline registry` → data/registry/REPORT.md.
# Bản kê khai AI (scripts/declaration.py, make declaration) đọc trực tiếp file này.
#
# Quy ước:
# - `sha256: pending` = tập chưa dựng; `make data` (bước registry, --update-hashes) điền hash thật.
# - `tos_checked_on: null` = CHƯA kiểm điều khoản sử dụng — bắt buộc kiểm trước khi crawl/tải (E03).
# - `source_type`: qppl | co_quan_nha_nuoc | ngan_hang | synthetic | open_dataset.
# - Tập do đội tự soạn tay (không dùng LLM) khai `source: synthetic`, `generator_model: human`.
# - Giấy phép NC (VIVOS) ⇒ `eval_only: true`, `redistribute: false`, `used_for: [eval]` (schema ép).

