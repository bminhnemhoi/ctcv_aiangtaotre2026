# Alertmanager template — rendered at container start by docker-compose.prod.yml:
#   __TELEGRAM_CHAT_ID__ ← $TELEGRAM_CHAT_ID (.env), bot token ← /tmp/telegram_bot_token.
# Alertmanager cannot expand environment variables itself, hence the sed step.
global:
  resolve_timeout: 5m

route:
  receiver: telegram-oncall
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  routes:
    - matchers: ["severity = critical"]
      receiver: telegram-oncall
      repeat_interval: 30m

receivers:
  - name: telegram-oncall
    telegram_configs:
      - bot_token_file: /tmp/telegram_bot_token
        chat_id: __TELEGRAM_CHAT_ID__
        parse_mode: ""
        send_resolved: true
        message: |
          {{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }} CTCV [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}
          {{ range .Alerts }}• {{ .Annotations.summary }}
            {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  # A down service makes its latency/error alerts noise.
  - source_matchers: ["alertname = ServiceDown"]
    target_matchers: ["alertname =~ HighP95Latency|HighErrorRate"]
    equal: ["service"]
